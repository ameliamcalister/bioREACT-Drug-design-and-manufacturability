<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>bioREACT — design a molecule someone can make</title>
    <meta
      name="description"
      content="Closed-loop molecule design with manufacturability in the loop: docking and two process-chemistry critics, then agents that estimate production route, cost at scale and time to manufacture."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before the first paint, so the page never
      // flashes light then switches. "system" stores nothing, which lets
      // the stylesheet fall through to prefers-color-scheme.
      try {
        var saved = localStorage.getItem('bioreact.theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
